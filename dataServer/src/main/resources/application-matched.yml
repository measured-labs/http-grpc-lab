# 측정 설정 matched: 연결·스레드 수를 하나의 값으로 맞춘다.
# 켜기: SPRING_PROFILES_ACTIVE=matched (값은 BENCH_MAX_CONCURRENCY, 없으면 512)
# 기동 로그의 BENCH_CONFIG 줄에 실제로 적용된 값이 찍힌다.
bench:
  max-concurrency: ${BENCH_MAX_CONCURRENCY:512}

server:
  tomcat:
    threads:
      max: ${bench.max-concurrency}
    # HTTP 연결을 끊지 않는다(gRPC 서버가 연결을 유지하는 것과 같게).
    # Tomcat 기본은 연결 하나에 100요청을 처리하고 끊고, 60초 쉬면 끊는다.
    max-keep-alive-requests: -1
    keep-alive-timeout: -1ms
